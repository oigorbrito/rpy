[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpy"
version = "0.1.0"
description = "RAG de resumo processual com FastAPI, PostgreSQL e pgvector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "asyncpg>=0.30,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "anthropic>=1.5.0,<2",
  "openai>=1.100,<2",
  "pgvector>=0.4,<1",
  "pypdf>=6.19,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.16,<0.17",
]
reranker = [
  "FlagEmbedding>=1.4.2,<1.5",
]
embeddings = [
  "FlagEmbedding>=1.4.2,<1.5",
]
observability = [
  "langfuse>=4.7,<5",
]

[project.urls]
Repository = "https://github.com/oigorbrito/rpy"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*", "sql*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep the pre-v0 gate high-signal: syntax/runtime-invalid constructs,
# undefined names, and invalid control-flow/import semantics. Style cleanup
# remains intentionally out of scope for the release hardening pass.
select = ["E9", "F63", "F7", "F82"]
