[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "rpy"
version = "0.1.0"
description = "RAG de resumo processual com FastAPI, PostgreSQL e pgvector"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "asyncpg>=0.30,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "anthropic>=0.64,<1",
  "openai>=1.100,<2",
  "pgvector>=0.4,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*", "sql*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
