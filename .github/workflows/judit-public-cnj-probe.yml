name: judit-public-cnj-probe

on:
  push:
    branches:
      - diag/judit-public-cnj-probe
    paths:
      - .github/workflows/judit-public-cnj-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUBLIC_TEST_CNJ: "0010153-96.2013.8.26.0597"
      PROVIDER_ACCEPTANCE_AUTHORIZED: "true"
      JUDIT_API_KEY: ${{ secrets.JUDIT_API_KEY }}
      JUDIT_ATTACHMENTS_ENABLED: "false"
      JUDIT_REQUESTS_BASE_URL: "https://requests.prod.judit.io"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      - name: Install bounded provider smoke environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --constraint requirements/constraints.txt -e .
          python -m pip check

      - name: Require provisioned Judit secret
        run: |
          if [ -z "$JUDIT_API_KEY" ]; then
            echo "::error::JUDIT_API_KEY is not provisioned."
            exit 1
          fi

      - name: Validate the public CNJ locally
        run: python scripts/provider_live_smoke.py --preflight-cnj --cnj "$PUBLIC_TEST_CNJ"

      - name: Run one Judit public-CNJ round trip
        run: |
          python scripts/provider_live_smoke.py             --judit-roundtrip             --cnj "$PUBLIC_TEST_CNJ"
