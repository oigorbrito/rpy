name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rpy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rpy_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Migration harness
        run: python scripts/migration_harness.py

      - name: Unit tests
        run: pytest -q tests --ignore=tests/integration

      - name: PostgreSQL integration tests
        run: pytest -q tests/integration
