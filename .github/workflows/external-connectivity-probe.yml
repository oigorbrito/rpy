name: external-connectivity-probe

on:
  push:
    branches:
      - diag/external-connectivity-probe
    paths:
      - scripts/external_connectivity_smoke.py
      - tests/test_external_connectivity_smoke.py
      - .github/workflows/external-connectivity-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Install Rpy test environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --constraint requirements/constraints.txt -e '.[dev]'
          python -m pip check

      - name: Run unit contract
        run: pytest -q tests/test_external_connectivity_smoke.py

      - name: Run live credential-free HTTPS POST probe
        run: python scripts/external_connectivity_smoke.py
