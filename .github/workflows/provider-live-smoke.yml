name: provider-live-smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Live provider call or replay a prior sanitized capture
        required: true
        type: choice
        default: live
        options:
          - live
          - replay
      replay_run_id:
        description: Prior provider-live-smoke run ID containing provider-acceptance-capture
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: provider-live-smoke-both
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      - name: Install bounded smoke dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --constraint requirements/constraints.txt -e .
          python -m pip check

      - name: Download prior sanitized capture for replay
        if: ${{ github.event.inputs.mode == 'replay' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN_ID: ${{ github.event.inputs.replay_run_id }}
        run: |
          if [ -z "$REPLAY_RUN_ID" ]; then
            echo "::error::replay_run_id is required in replay mode."
            exit 1
          fi
          mkdir -p provider-acceptance-artifacts
          gh run download "$REPLAY_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name provider-acceptance-capture \
            --dir provider-acceptance-artifacts

      - name: Replay sanitized capture without provider calls
        if: ${{ github.event.inputs.mode == 'replay' }}
        env:
          PROVIDER_ACCEPTANCE_CNJ: ${{ secrets.PROVIDER_ACCEPTANCE_CNJ }}
        run: |
          if [ -z "$PROVIDER_ACCEPTANCE_CNJ" ]; then
            echo "::error::PROVIDER_ACCEPTANCE_CNJ is required to verify replay identity."
            exit 1
          fi
          python scripts/provider_live_smoke.py \
            --provider both \
            --replay-file provider-acceptance-artifacts/provider-smoke-capture.json

      - name: Run controlled Judit + DataJud live smoke and capture evidence
        if: ${{ github.event.inputs.mode == 'live' }}
        env:
          PROVIDER_ACCEPTANCE_CNJ: ${{ secrets.PROVIDER_ACCEPTANCE_CNJ }}
          PROVIDER_ACCEPTANCE_AUTHORIZED: ${{ secrets.PROVIDER_ACCEPTANCE_AUTHORIZED }}
          JUDIT_API_KEY: ${{ secrets.JUDIT_API_KEY }}
          JUDIT_ATTACHMENTS_ENABLED: "false"
          DATAJUD_ENABLED: "true"
          DATAJUD_AUTHORIZED_USE: ${{ secrets.DATAJUD_AUTHORIZED_USE }}
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
        run: |
          if [ -z "$PROVIDER_ACCEPTANCE_CNJ" ]; then
            echo "::notice::PROVIDER_ACCEPTANCE_CNJ is not provisioned; combined live provider smoke is armed but not executed."
            exit 0
          fi
          if [ "$PROVIDER_ACCEPTANCE_AUTHORIZED" != "true" ]; then
            echo "::notice::PROVIDER_ACCEPTANCE_AUTHORIZED is not true; combined live provider smoke is armed but not executed."
            exit 0
          fi
          if [ -z "$JUDIT_API_KEY" ]; then
            echo "::notice::JUDIT_API_KEY is not provisioned; combined live provider smoke is armed but not executed."
            exit 0
          fi
          if [ "$DATAJUD_AUTHORIZED_USE" != "true" ] || [ -z "$DATAJUD_API_KEY" ]; then
            echo "::notice::DataJud authorization/key is not provisioned; combined live provider smoke is armed but not executed."
            exit 0
          fi
          python scripts/provider_live_smoke.py \
            --provider both \
            --capture-file provider-acceptance-artifacts/provider-smoke-capture.json

      - name: Upload sanitized provider capture
        if: ${{ github.event.inputs.mode == 'live' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-acceptance-capture
          path: provider-acceptance-artifacts/provider-smoke-capture.json
          if-no-files-found: ignore
          retention-days: 90
