name: judit-finalization-probe

on:
  push:
    branches:
      - diag/judit-finalization-probe
    paths:
      - .github/workflows/judit-finalization-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rpy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rpy_test
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      JUDIT_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements/constraints.txt

      - name: Install Rpy test environment
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --constraint requirements/constraints.txt -e '.[dev]'
          python -m pip check

      - name: Replay-tool contract
        run: pytest -q tests/test_judit_replay_tools.py

      - name: Webhook and finalization integration path
        run: |
          pytest -q             tests/integration/test_pipeline_e2e.py             tests/integration/test_webhook_atomicity.py             tests/integration/test_judit_out_of_order_postgres.py             tests/integration/test_finalize_atomicity_postgres.py             tests/integration/test_finalize_idempotency_postgres.py

      - name: Full offline Judit-to-summary smoke
        run: ./scripts/smoke_offline.sh
